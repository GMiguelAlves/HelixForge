<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
<title id="title">Descriptive execution time</title>
<desc id="desc">Shared-cluster wall time; logarithmic axis, not a controlled speed comparison</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:26px;font-weight:700}.subtitle{font-size:14px;fill:#5b6475}.label{font-size:15px;font-weight:600}.value{font-size:14px}.small{font-size:12px;fill:#5b6475}.axis{stroke:#d9dee8;stroke-width:1}.status{font-size:13px;font-weight:700;fill:#ffffff}</style>
<text x="48" y="46" class="title">Descriptive execution time</text>
<text x="48" y="72" class="subtitle">Shared-cluster wall time; logarithmic axis, not a controlled speed comparison</text>
<text x="48" y="148" class="label">Synthetic ground truth</text>
<rect x="310" y="125" width="403.0" height="34" rx="5" fill="#0969da"/>
<text x="725.0" y="148" class="value">1.4 min</text>
<text x="48" y="218" class="label">Manifest re-entry</text>
<rect x="310" y="195" width="402.6" height="34" rx="5" fill="#0969da"/>
<text x="724.6" y="218" class="value">1.4 min</text>
<text x="48" y="288" class="label">Negative contracts</text>
<rect x="310" y="265" width="212.9" height="34" rx="5" fill="#0969da"/>
<text x="534.9" y="288" class="value">9.4 s</text>
<text x="48" y="358" class="label">Real biological integration</text>
<rect x="310" y="335" width="700.0" height="34" rx="5" fill="#0969da"/>
<text x="1022.0" y="358" class="value">37.0 min</text>
<text x="48" y="430" class="small">Synthetic and re-entry values are means of two runs; contracts cover two iterations; real integration is approximate workflow wall time.</text>
</svg>
