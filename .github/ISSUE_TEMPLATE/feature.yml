name: Feature request
description: Propose a provider, workflow capability or usability improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: User or scientific need
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Affected public contract
      description: State whether this changes inputs, outputs, schemas, models or only internals.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Suggested validation
