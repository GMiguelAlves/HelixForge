name: Software bug
description: Report reproducible workflow or infrastructure behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private data, credentials and institutional paths from logs.
  - type: input
    id: version
    attributes:
      label: HelixForge commit or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Java, Nextflow, profile, executor and container runtime.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Minimal command and inputs
      description: Use synthetic/public paths and redact secrets.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
