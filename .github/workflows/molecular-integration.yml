name: Molecular evidence integration

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  integration-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install certified Nextflow
        run: curl -fsSL https://get.nextflow.io | NXF_VER=25.10.7 bash
      - name: Run unit, contract and legacy-regression tests
        run: |
          python3 -m pip install --disable-pip-version-check jsonschema==4.23.0
          python3 -m unittest tests.evidence_providers.test_evidence_providers -v
          python3 -m unittest tests.molecular_integration.test_molecular_integration -v
      - name: Prepare standardized evidence fixture
        run: python3 tests/molecular_integration/prepare_fixture.py --output /tmp/helixforge-integration-fixture
      - name: Lint DSL2
        run: ./nextflow lint .
      - name: Validate molecular integration stubs
        run: |
          ./nextflow run tests/molecular_integration/main.nf -c tests/molecular_integration/nextflow.config --rna_evidence /tmp/helixforge-integration-fixture/rna --chip_evidence /tmp/helixforge-integration-fixture/chip --outdir /tmp/integration-stub -stub-run
      - name: Run dependency-free molecular integration fixture
        run: |
          ./nextflow run tests/molecular_integration/main.nf -c tests/molecular_integration/nextflow.config --rna_evidence /tmp/helixforge-integration-fixture/rna --chip_evidence /tmp/helixforge-integration-fixture/chip --outdir /tmp/integration-real
          python3 bin/validate_molecular_integration.py /tmp/integration-real/integration/harmonization/harmonized_evidence/harmonization_manifest.json
          python3 bin/validate_molecular_integration.py /tmp/integration-real/integration/master/integrated_evidence/integration_manifest.json
