name: RNA-seq report container

on:
  push:
    branches: [master]
    paths:
      - 'containers/rnaseq-report/**'
      - 'modules/local/rnaseq_gene_report/environment.yml'
      - '.github/workflows/rnaseq-report-container.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/rnaseq-report/Dockerfile
          push: true
          tags: ghcr.io/gmiguelalves/helixforge-rnaseq-report:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
