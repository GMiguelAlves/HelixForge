name: Native differential expression

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Nextflow
        run: curl -fsSL https://get.nextflow.io | bash
      - name: Run Python unit tests
        run: python3 tests/run_unit_tests.py
      - name: Validate contracts
        run: |
          tests/native_de/run_invalid_inputs.sh
          ./nextflow lint main.nf
          NEXTFLOW="$PWD/nextflow" tests/native_de/run_stub.sh
      - name: Validate published DESeq2 image
        run: |
          docker pull ghcr.io/gmiguelalves/helixforge-deseq2:1.0.0
          NEXTFLOW="$PWD/nextflow" \
          DESEQ2_TEST_IMAGE=ghcr.io/gmiguelalves/helixforge-deseq2:1.0.0 \
          tests/native_de/run_regression.sh
