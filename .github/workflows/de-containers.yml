name: Differential expression containers

on:
  push:
    branches: [master]
    paths:
      - 'containers/deseq2/**'
      - 'modules/local/deseq2_model/environment.yml'
      - '.github/workflows/de-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deseq2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/deseq2/Dockerfile
          push: true
          tags: ghcr.io/gmiguelalves/helixforge-deseq2:1.0.1
          cache-from: |
            type=registry,ref=ghcr.io/gmiguelalves/helixforge-deseq2:1.0.0
            type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Scientific regression
        run: |
          curl -fsSL https://get.nextflow.io | NXF_VER=25.10.7 bash
          docker pull ghcr.io/gmiguelalves/helixforge-deseq2:1.0.1
          NEXTFLOW="$PWD/nextflow" \
          DESEQ2_TEST_IMAGE=ghcr.io/gmiguelalves/helixforge-deseq2:1.0.1 \
          tests/native_de/run_regression.sh
          NEXTFLOW="$PWD/nextflow" \
          DESEQ2_TEST_IMAGE=ghcr.io/gmiguelalves/helixforge-deseq2:1.0.1 \
          tests/native_de/run_cache_tests.sh
