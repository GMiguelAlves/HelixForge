name: Import API containers

on:
  push:
    branches:
      - master
      - contrib/native-import-api
    paths:
      - containers/import/**
      - containers/import-python/**
      - modules/local/tximport/environment.yml
      - .github/workflows/import-containers.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: helixforge-import
            context: .
            file: containers/import/Dockerfile
          - name: helixforge-import-python
            context: .
            file: containers/import-python/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/gmiguelalves/${{ matrix.name }}:1.0.0
          provenance: true
          sbom: true
