name: ChIP-seq container certification

on:
  push:
    branches: [master, contrib/container-certification]
    paths:
      - 'containers/chipseq-*/**'
      - 'modules/local/bowtie2_align/environment.yml'
      - 'modules/local/frip/environment.yml'
      - 'modules/local/featurecounts_peak/environment.yml'
      - 'tests/containers/certify_chipseq_image.sh'
      - '.github/workflows/chipseq-containers.yml'
  pull_request:
    paths:
      - 'containers/chipseq-*/**'
      - 'modules/local/bowtie2_align/environment.yml'
      - 'modules/local/frip/environment.yml'
      - 'modules/local/featurecounts_peak/environment.yml'
      - 'tests/containers/certify_chipseq_image.sh'
      - '.github/workflows/chipseq-containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-certify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: alignment
            image: helixforge-chipseq-alignment
            dockerfile: containers/chipseq-alignment/Dockerfile
          - role: intervals
            image: helixforge-chipseq-intervals
            dockerfile: containers/chipseq-intervals/Dockerfile
          - role: counts
            image: helixforge-chipseq-counts
            dockerfile: containers/chipseq-counts/Dockerfile
          - role: tracks
            image: helixforge-chipseq-tracks
            dockerfile: containers/chipseq-tracks/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/gmiguelalves/${{ matrix.image }}:1.0.0
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: ${{ github.event_name != 'pull_request' }}
          sbom: ${{ github.event_name != 'pull_request' }}
      - name: Pull published image
        if: github.event_name != 'pull_request'
        run: docker pull ghcr.io/gmiguelalves/${{ matrix.image }}:1.0.0
      - name: Run functional certification
        run: |
          case_root=/tmp/helixforge-chipseq-container-certification/${{ matrix.role }}
          tests/containers/certify_chipseq_image.sh \
            '${{ matrix.role }}' \
            'ghcr.io/gmiguelalves/${{ matrix.image }}:1.0.0' \
            "$case_root"
          printf '### %s container\n\n- Build digest: `%s`\n- Functional test: PASS\n' \
            '${{ matrix.role }}' '${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: chipseq-${{ matrix.role }}-container-certification
          path: /tmp/helixforge-chipseq-container-certification/${{ matrix.role }}
          if-no-files-found: error
