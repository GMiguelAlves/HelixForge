name: idr_provider
description: Run the pinned statistical IDR provider for two biological narrowPeak replicates.
keywords: [chipseq, idr, reproducibility, provider]
tools:
  - idr:
      description: Irreproducible Discovery Rate statistical provider.
      homepage: https://github.com/nboley/idr
input:
  - meta: Validated experiment-group identity.
  - peak_dirs: Two premerged biological-replicate Peak Calling directories.
  - request: Validated IDR request with explicit threshold and rank metric.
output:
  - artifacts: IDR-filtered peak table/BED, raw IDR output, plot, evidence, and statistics.
  - reports: Command, IDR logs, and raw provider output.
  - versions: IDR package and Python versions.
  - execution_metadata: Structured command, resources, runtime, and timing.
  - manifest: Completed provider-neutral IDR manifest with checksums.
  - status: Complete or complete-empty marker.
