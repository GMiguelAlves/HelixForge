name: BAM_SELECT
description: Apply explicit MAPQ, include-flag, exclude-flag and optional region selection.
keywords: [bam, samtools, mapq, flags, chipseq]
tools:
  - samtools: {description: SAM/BAM processing toolkit}
input:
  - bam: Coordinate-sorted input BAM.
  - bai: Matching input BAM index.
  - reference: Reference FASTA used by the alignment.
  - select_params: Explicit selection policy.
output:
  - artifacts: Selected coordinate-sorted BAM.
  - reports: Metrics, MAPQ distribution, contigs, parameters, command and log.
  - versions: Tool versions YAML.
  - execution_metadata: Command, resources and checksums.
  - manifest: Partial BAM-processing manifest.
  - status: Completion JSON.

