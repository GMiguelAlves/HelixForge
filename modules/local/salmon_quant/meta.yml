name: salmon_quant
description: Quantify transcript abundance with Salmon through the OmicsFlow Quantification API.
keywords: [quantification, rna-seq, salmon, transcriptome]
tools:
  - salmon:
      description: Highly accurate and fast transcript-level quantification
      homepage: https://combine-lab.github.io/salmon/
      doi: 10.1038/nmeth.4197
      licence: [GPL-3.0-or-later]
input:
  - meta: {type: map, required: true}
  - reads: {type: file, required: true}
  - transcriptome: {type: file, required: true}
  - transcriptome_index: {type: directory, required: true}
  - quantification_params: {type: map, required: true}
output:
  - artifacts: {type: directory, pattern: salmon_quant}
  - reports: {type: tuple, description: Command logs and normalized statistics}
  - versions: {type: file, pattern: '*.versions.yml'}
  - execution_metadata: {type: file, pattern: '*.execution.json'}
  - manifest: {type: file, pattern: '*.manifest.json'}
  - status: {type: file, pattern: '*.salmon_quant.done'}
authors:
  - OmicsFlow contributors
